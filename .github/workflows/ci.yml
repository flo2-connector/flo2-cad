name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: The committed bundle (dist/) is the one the sources build
        run: git diff --exit-code -- dist/

  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: The vendored kernel is byte-identical to manifold-3d 3.5.4 on npm
        run: node scripts/verify-kernel.mjs

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t flo2-cad:ci .
      - name: It answers --version with no network on a read-only root
        run: docker run --rm --network none --read-only flo2-cad:ci --version
      - name: It serves its six tools over stdio, confined like flo2's slot
        run: |
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'; sleep 5; } \
            | timeout 60 docker run --rm -i --cpus 1 --memory 1g --network none --read-only flo2-cad:ci > out.jsonl || true
          for t in start_piece change_piece preview_piece check_piece export_for_casting describe_piece; do
            grep -q "\"name\":\"$t\"" out.jsonl || { echo "missing $t"; cat out.jsonl; exit 1; }
          done
      - name: A wire-and-blend ring is checked within flo2's 60 s door, confined like flo2's slot
        run: node scripts/slot-check.mjs flo2-cad:ci test/fixtures/moonstone-openwork-ring.tree.json 60 1g
      - name: A piece written as a program is evaluated in its own confined process inside the image, and checked within the door at 768 MiB
        run: node scripts/slot-check.mjs flo2-cad:ci test/fixtures/cabochon-in-bezel.tree.json 60 768m must-pass
